<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스네이크 게임</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>스네이크 게임</h1>

    <div class="scores">
      <span>점수: <strong id="score">0</strong></span>
      <span>최고 점수: <strong id="high-score">0</strong></span>
      <span>레벨: <strong id="level">1</strong></span>
    </div>

    <div class="difficulty">
      <label for="difficulty">난이도</label>
      <select id="difficulty">
        <option value="200">쉬움 (200ms)</option>
        <option value="150" selected>보통 (150ms)</option>
        <option value="100">어려움 (100ms)</option>
        <option value="50">매우 어려움 (50ms)</option>
      </select>
    </div>

    <canvas id="board" width="400" height="400"></canvas>

    <p id="message" class="message">방향키로 뱀을 조종하세요</p>

    <button type="button" id="start-btn">게임 시작</button>
    <button type="button" id="restart-btn" hidden>다시 시작</button>
    <button type="button" id="pause-btn" hidden>일시정지</button>
    <button type="button" id="sound-btn" class="sub-btn">🔊 소리 켜짐</button>
  </main>
</body>
</html>
